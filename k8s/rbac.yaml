apiVersion: v1
kind: ServiceAccount
metadata:
  name: carbonpilot
  namespace: default

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: carbonpilot-job-manager
  namespace: default
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: carbonpilot-job-manager-binding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: carbonpilot
    namespace: default
roleRef:
  kind: Role
  name: carbonpilot-job-manager
  apiGroup: rbac.authorization.k8s.io
